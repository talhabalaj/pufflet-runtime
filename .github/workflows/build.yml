name: Build runtime

on:
  push:
    branches: [main]
    tags: ['wine-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          brew install bison flex llvm lld mingw-w64 meson ninja nasm cmake pkg-config \
            autoconf automake libtool freetype
          xcodebuild -downloadComponent MetalToolchain

      # Caches are saved right after their step, so a later failure or timeout
      # doesn't throw away hours of library/LLVM builds.
      - name: Restore LLVM 15
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: build/llvm-15-x86_64
          key: llvm-15.0.7-x86_64-v1

      - name: Restore libraries
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: build/deps
          key: deps-${{ hashFiles('scripts/build-deps.sh', 'scripts/config.sh', 'sources/freetype/**/meson.build', 'sources/gnutls/gnutls/NEWS', 'sources/glib/meson.build', 'sources/gstreamer/meson.build') }}

      - name: Wine tools
        run: scripts/build-wine.sh tools
      - name: Libraries
        run: scripts/build-deps.sh
      - name: Save libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/deps
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}
      - name: LLVM 15
        run: scripts/build-dxmt.sh llvm
      - name: Save LLVM 15
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/llvm-15-x86_64
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Wine
        run: scripts/build-wine.sh
      - name: DXMT
        run: scripts/build-dxmt.sh
      - name: Stage
        run: scripts/stage.sh

      - name: Archive
        run: |
          name="pufflet-runtime-$(git describe --tags --always)"
          COPYFILE_DISABLE=1 tar --no-xattrs -cJf "$name.tar.xz" -C build/install PuffletRuntime.app
          shasum -a 256 "$name.tar.xz" | tee "$name.tar.xz.sha256"
          echo "ARCHIVE=$name.tar.xz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pufflet-runtime
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/logs

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --title "$GITHUB_REF_NAME" --notes "Unsigned runtime; Pufflet's package-runtime.sh signs and notarizes it."
